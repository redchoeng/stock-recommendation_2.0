name: Auto Deploy Stock Reports

on:
  # 미국 동부시간(ET) 기준 스케줄
  # 프리마켓: 04:00-09:30 ET | 정규장: 09:30-16:00 ET | 애프터장: 16:00-20:00 ET
  # UTC 시간 → ET 시간 → KST 시간
  schedule:
    - cron: '0 1 * * 1-5'    # UTC 01:00 = ET 20:00 = KST 10:00 (애프터장 마감)
    - cron: '0 9 * * 1-5'    # UTC 09:00 = ET 04:00 = KST 18:00 (프리마켓 시작)
    - cron: '0 12 * * 1-5'   # UTC 12:00 = ET 07:00 = KST 21:00 (프리마켓)
    - cron: '30 14 * * 1-5'  # UTC 14:30 = ET 09:30 = KST 23:30 (정규장 시작)
    - cron: '30 15 * * 1-5'  # UTC 15:30 = ET 10:30 = KST 00:30 (정규장)
    - cron: '30 18 * * 0-4'  # UTC 18:30 = ET 13:30 = KST 03:30 (정규장)
    - cron: '30 20 * * 0-4'  # UTC 20:30 = ET 15:30 = KST 05:30 (정규장 마감 30분전)
    - cron: '30 21 * * 0-4'  # UTC 21:30 = ET 16:30 = KST 06:30 (애프터장 초반)
    - cron: '0 23 * * 0-4'   # UTC 23:00 = ET 18:00 = KST 08:00 (애프터장 중반)
    - cron: '0 0 * * 1-5'    # UTC 00:00 = ET 19:00 = KST 09:00 (애프터장 후반)

  # 푸시할 때도 실행
  push:
    branches:
      - main

  # 수동 실행도 가능
  workflow_dispatch:

concurrency:
  group: deploy-reports
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_EMAIL: ${{ secrets.VAPID_EMAIL }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Check if analysis files changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- project_titan.py requirements.txt .github/workflows/deploy.yml)
            if [ -z "$CHANGED" ]; then
              echo "analysis_changed=false" >> $GITHUB_OUTPUT
              echo "Skipping analysis - no analysis files changed"
            else
              echo "analysis_changed=true" >> $GITHUB_OUTPUT
              echo "Analysis files changed: $CHANGED"
            fi
          else
            echo "analysis_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check if US Market is Open
        id: market_check
        run: |
          python -c "
          from datetime import datetime, timedelta
          import pytz

          et_tz = pytz.timezone('America/New_York')
          now_et = datetime.now(et_tz)
          weekday = now_et.weekday()  # 0=Mon, 6=Sun

          # 월-금만 거래일 (공휴일은 별도 체크 안함 - yfinance가 알아서 처리)
          is_trading_day = weekday < 5
          print(f'Trading day: {is_trading_day}, ET: {now_et.strftime(\"%Y-%m-%d %H:%M\")}')

          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'is_open={str(is_trading_day).lower()}\n')
          "

      - name: Generate Growth Stocks Report with Titan Algorithm
        if: steps.market_check.outputs.is_open == 'true' || (github.event_name == 'push' && steps.changes.outputs.analysis_changed == 'true') || github.event_name == 'workflow_dispatch'
        run: |
          python project_titan.py growth

      - name: Generate Value Stocks Report with Titan Algorithm
        if: steps.market_check.outputs.is_open == 'true' || (github.event_name == 'push' && steps.changes.outputs.analysis_changed == 'true') || github.event_name == 'workflow_dispatch'
        run: |
          python project_titan.py value

      - name: Generate Portfolio Composition Page
        if: steps.market_check.outputs.is_open == 'true' || (github.event_name == 'push' && steps.changes.outputs.analysis_changed == 'true') || github.event_name == 'workflow_dispatch'
        run: |
          python project_titan.py portfolio

      - name: Generate Changelog Page
        run: |
          python project_titan.py changelog

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A

          # 변경사항이 있을 때만 커밋
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update reports with Titan v2.0 - $(date -u '+%Y-%m-%d %H:%M') UTC"
            # 리모트에 새 커밋이 있으면 pull 후 재시도
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push failed, retrying ($i/3)..."
              sleep 5
            done
          fi
