name: Auto Deploy Stock Reports

on:
  # 18:00 KST ~ 06:00 KST (09:00 ~ 21:00 UTC) 매시 정각 실행
  schedule:
    - cron: '0 9-21 * * *'

  # 푸시할 때도 실행
  push:
    branches:
      - main

  # 수동 실행도 가능
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests tabulate ta

      - name: Generate NASDAQ 100 Report with Titan Algorithm
        run: |
          python project_titan.py nasdaq

      - name: Generate Value Stocks Report with Titan Algorithm
        run: |
          python project_titan.py value

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A

          # 변경사항이 있을 때만 커밋
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update reports with Titan v2.0 - $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
