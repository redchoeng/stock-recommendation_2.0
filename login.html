<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Titan Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    min-height: 100vh;
    background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 30%, #F7DC6F 70%, #FADBD8 100%);
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
}
.cloud { position:fixed; background:white; border-radius:50px; opacity:0.9; animation:float 20s infinite ease-in-out; z-index:0; }
.cloud::before,.cloud::after { content:''; position:absolute; background:white; border-radius:50%; }
.cloud-1 { width:100px; height:40px; top:8%; left:-100px; }
.cloud-1::before { width:50px; height:50px; top:-25px; left:15px; }
.cloud-1::after { width:35px; height:35px; top:-15px; left:55px; }
.cloud-2 { width:120px; height:45px; top:15%; left:-120px; animation-delay:-7s; }
.cloud-2::before { width:55px; height:55px; top:-30px; left:20px; }
.cloud-2::after { width:40px; height:40px; top:-18px; left:65px; }
@keyframes float { 0%{transform:translateX(0)} 100%{transform:translateX(calc(100vw + 200px))} }

.login-box {
    position: relative;
    z-index: 10;
    background: white;
    border-radius: 30px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    border: 4px solid #5D4E37;
    box-shadow: 0 8px 0 #C4A35A, 0 12px 30px rgba(0,0,0,0.15);
    text-align: center;
}
.emoji-icon { font-size: 3.5em; margin-bottom: 15px; animation: bounce 2s infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
h1 { color: #5D4E37; font-size: 1.8em; margin-bottom: 8px; }
.subtitle { color: #7B6B4F; font-size: 0.9em; margin-bottom: 30px; }

.divider { display:flex; align-items:center; gap:12px; margin: 25px 0; color: #aaa; font-size:0.85em; }
.divider::before,.divider::after { content:''; flex:1; height:1px; background:#ddd; }

.btn-social {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 14px 20px;
    border: 3px solid #5D4E37;
    border-radius: 15px;
    font-size: 1em;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    margin-bottom: 12px;
}
.btn-social:hover { transform: translateY(-2px); }
.btn-social:active { transform: translateY(1px); }

.btn-github {
    background: #24292e;
    color: white;
    box-shadow: 0 4px 0 #1a1d21;
}
.btn-github:hover { background: #2f363d; }

.btn-google {
    background: white;
    color: #5D4E37;
    box-shadow: 0 4px 0 #ddd;
}
.btn-google:hover { background: #f8f8f8; }

.btn-email {
    background: #3498DB;
    color: white;
    box-shadow: 0 4px 0 #2980B9;
}
.btn-email:hover { background: #5DADE2; }

.email-form { display: none; margin-top: 20px; }
.email-form.active { display: block; }
.input-field {
    width: 100%;
    padding: 12px 16px;
    border: 3px solid #5D4E37;
    border-radius: 12px;
    font-size: 1em;
    font-family: inherit;
    margin-bottom: 10px;
    background: #FAFAFA;
}
.input-field:focus { outline: none; border-color: #3498DB; box-shadow: 0 0 10px rgba(52,152,219,0.2); }

.btn-submit {
    width: 100%;
    padding: 14px;
    background: #27AE60;
    color: white;
    border: 3px solid #5D4E37;
    border-radius: 15px;
    font-size: 1em;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 0 #1E8449;
    font-family: inherit;
    transition: all 0.2s;
}
.btn-submit:hover { transform: translateY(-2px); }

.toggle-link {
    margin-top: 15px;
    color: #3498DB;
    cursor: pointer;
    font-size: 0.9em;
}
.toggle-link:hover { text-decoration: underline; }

.message {
    margin-top: 15px;
    padding: 10px 15px;
    border-radius: 10px;
    font-size: 0.9em;
    display: none;
}
.message.error { display:block; background:#FDEDEC; color:#E74C3C; border:2px solid #E74C3C; }
.message.success { display:block; background:#D5F5E3; color:#27AE60; border:2px solid #27AE60; }

.back-link {
    display: inline-block;
    margin-top: 20px;
    color: #7B6B4F;
    text-decoration: none;
    font-size: 0.85em;
}
.back-link:hover { color: #5D4E37; }

.loading { display:none; }
.loading.active { display:inline-block; animation: spin 1s linear infinite; }
@keyframes spin { 100%{transform:rotate(360deg)} }
</style>
</head>
<body>
<div class="cloud cloud-1"></div>
<div class="cloud cloud-2"></div>

<div class="login-box">
    <div class="emoji-icon">🔐</div>
    <h1>Titan Portfolio</h1>
    <p class="subtitle">개인 자산 포트폴리오 관리 시스템</p>

    <button class="btn-social btn-github" onclick="loginWithGithub()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub로 로그인
    </button>

    <button class="btn-social btn-google" onclick="loginWithGoogle()">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Google로 로그인
    </button>

    <div class="divider">또는</div>

    <button class="btn-social btn-email" onclick="toggleEmailForm()" id="emailToggle">
        이메일로 로그인
    </button>

    <div class="email-form" id="emailForm">
        <input type="email" class="input-field" id="emailInput" placeholder="이메일 주소">
        <input type="password" class="input-field" id="passwordInput" placeholder="비밀번호 (6자 이상)">
        <button class="btn-submit" onclick="loginWithEmail()" id="emailSubmitBtn">
            <span class="loading" id="loadingSpinner">&#x21bb;</span>
            <span id="emailBtnText">로그인</span>
        </button>
        <div class="toggle-link" onclick="toggleSignup()" id="toggleText">
            계정이 없으신가요? <strong>회원가입</strong>
        </div>
    </div>

    <div class="message" id="message"></div>

    <div class="divider">또는</div>

    <button class="btn-social" onclick="startGuest()" style="background:#95A5A6;color:white;box-shadow:0 4px 0 #7F8C8D;">
        👤 비회원으로 시작
    </button>
    <div style="font-size:0.78em;color:#999;margin-top:4px;">리포트 열람만 가능 · 포트폴리오 기능 제한</div>

    <a href="admin_setup.html" style="display:inline-block;margin-top:20px;color:#E74C3C;text-decoration:none;font-size:0.82em;font-weight:700;">🔑 관리자 계정 등록</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase_config.js"></script>
<script>
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let isSignup = false;

// 현재 페이지 기준 base URL 계산 (GitHub Pages 서브 경로 대응)
const BASE_URL = window.location.href.replace(/\/[^/]*$/, '/');

// 이미 로그인 상태면 메인으로
sb.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'index.html';
});

async function loginWithGithub() {
    const { error } = await sb.auth.signInWithOAuth({
        provider: 'github',
        options: { redirectTo: BASE_URL + 'index.html' }
    });
    if (error) showMessage(error.message, 'error');
}

async function loginWithGoogle() {
    const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: BASE_URL + 'index.html' }
    });
    if (error) showMessage(error.message, 'error');
}

function toggleEmailForm() {
    document.getElementById('emailForm').classList.toggle('active');
}

function toggleSignup() {
    isSignup = !isSignup;
    document.getElementById('emailBtnText').textContent = isSignup ? '회원가입' : '로그인';
    document.getElementById('toggleText').innerHTML = isSignup
        ? '이미 계정이 있으신가요? <strong>로그인</strong>'
        : '계정이 없으신가요? <strong>회원가입</strong>';
}

async function loginWithEmail() {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;

    if (!email || !password) { showMessage('이메일과 비밀번호를 입력하세요', 'error'); return; }
    if (password.length < 6) { showMessage('비밀번호는 6자 이상이어야 합니다', 'error'); return; }

    setLoading(true);

    if (isSignup) {
        const { error } = await sb.auth.signUp({ email, password });
        setLoading(false);
        if (error) { showMessage(error.message, 'error'); return; }
        showMessage('확인 이메일을 보냈습니다. 메일을 확인해주세요!', 'success');
    } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        setLoading(false);
        if (error) { showMessage(error.message, 'error'); return; }
        window.location.href = 'index.html';
    }
}

function showMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.className = 'message ' + type;
}

function setLoading(on) {
    document.getElementById('loadingSpinner').classList.toggle('active', on);
    document.getElementById('emailSubmitBtn').disabled = on;
}

function startGuest() {
    sessionStorage.setItem('titan_guest', 'true');
    window.location.href = 'index.html';
}

// Enter 키로 로그인
document.getElementById('passwordInput')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loginWithEmail();
});
</script>
</body>
</html>
