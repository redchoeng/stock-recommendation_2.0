<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Project Titan</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    min-height: 100vh;
    background: #0f172a;
    color: #191f28;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow: hidden;
}

/* 배경 글로우 */
.bg-glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
    pointer-events: none;
}
.bg-glow-1 {
    width: 500px; height: 500px;
    background: #4263eb;
    top: -150px; right: -100px;
}
.bg-glow-2 {
    width: 400px; height: 400px;
    background: #7c3aed;
    bottom: -100px; left: -80px;
}
.bg-glow-3 {
    width: 300px; height: 300px;
    background: #20c997;
    bottom: 20%; right: 10%;
    opacity: 0.15;
}

.login-card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 400px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.4), 0 0 60px rgba(66,99,235,0.15);
}

/* 브랜드 헤더 영역 */
.brand-header {
    background: linear-gradient(135deg, #4263eb 0%, #7c3aed 100%);
    padding: 36px 36px 32px;
    text-align: center;
    position: relative;
}
.brand-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: rgba(255,255,255,0.1);
}
.brand-logo {
    width: 52px; height: 52px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    border: 1px solid rgba(255,255,255,0.2);
}
.brand-logo svg { color: white; }
.brand-header h1 {
    font-size: 1.5em;
    font-weight: 800;
    color: white;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
}
.brand-header p {
    color: rgba(255,255,255,0.7);
    font-size: 0.85em;
}

/* 폼 영역 */
.form-body {
    background: #ffffff;
    padding: 32px 36px 36px;
}

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
    color: #b0b8c1;
    font-size: 0.8em;
}
.divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e5e8eb;
}

.btn-social {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 12px 20px;
    border: 1.5px solid #e5e8eb;
    border-radius: 12px;
    font-size: 0.9em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    margin-bottom: 10px;
    background: #fff;
    color: #191f28;
}
.btn-social:hover {
    border-color: #4263eb;
    background: #edf2ff;
    color: #4263eb;
}
.btn-social:active { transform: scale(0.98); }

.btn-github {
    background: #24292e;
    color: white;
    border-color: #24292e;
}
.btn-github:hover { background: #2f363d; border-color: #2f363d; color: white; }

.btn-email-toggle {
    background: #4263eb;
    color: white;
    border-color: #4263eb;
}
.btn-email-toggle:hover { background: #3b5bdb; border-color: #3b5bdb; color: white; }

.email-form { display: none; margin-top: 18px; }
.email-form.active { display: block; }

.input-field {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid #e5e8eb;
    border-radius: 10px;
    font-size: 0.92em;
    font-family: inherit;
    margin-bottom: 10px;
    background: #f7f8fa;
    color: #191f28;
    outline: none;
    transition: all 0.2s;
}
.input-field:focus {
    border-color: #4263eb;
    box-shadow: 0 0 0 3px rgba(66,99,235,0.1);
    background: #fff;
}
.input-field::placeholder { color: #b0b8c1; }

.btn-submit {
    width: 100%;
    padding: 12px;
    background: #20c997;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 0.92em;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.btn-submit:hover { background: #12b886; }
.btn-submit:active { transform: scale(0.98); }
.btn-submit:disabled { background: #b0b8c1; cursor: wait; }

.toggle-link {
    margin-top: 12px;
    color: #4263eb;
    cursor: pointer;
    font-size: 0.82em;
    font-weight: 500;
}
.toggle-link:hover { text-decoration: underline; }

.message {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.82em;
    display: none;
    line-height: 1.5;
}
.message.error { display: block; background: #fff0f6; color: #e03e6a; }
.message.success { display: block; background: #e6fcf5; color: #0ca678; }

.btn-guest {
    background: #f7f8fa;
    color: #8b95a1;
    border-color: #e5e8eb;
}
.btn-guest:hover { background: #e5e8eb; color: #191f28; border-color: #e5e8eb; }

.guest-note {
    font-size: 0.73em;
    color: #b0b8c1;
    margin-top: 2px;
    margin-bottom: 4px;
}

.admin-link {
    display: inline-block;
    margin-top: 14px;
    color: #b0b8c1;
    text-decoration: none;
    font-size: 0.78em;
    font-weight: 500;
    transition: color 0.2s;
}
.admin-link:hover { color: #4263eb; }

.loading { display: none; }
.loading.active { display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }

@media (max-width: 480px) {
    .brand-header { padding: 28px 24px 24px; }
    .form-body { padding: 24px 24px 28px; }
    .brand-header h1 { font-size: 1.3em; }
}
</style>
</head>
<body>

<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="bg-glow bg-glow-3"></div>

<div class="login-card">
    <div class="brand-header">
        <div class="brand-logo">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1>Project Titan</h1>
        <p>개인 자산 포트폴리오 관리 시스템</p>
    </div>

    <div class="form-body">
        <button class="btn-social btn-github" onclick="loginWithGithub()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            GitHub로 로그인
        </button>

        <button class="btn-social" onclick="loginWithGoogle()">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google로 로그인
        </button>

        <div class="divider">또는</div>

        <button class="btn-social btn-email-toggle" onclick="toggleEmailForm()" id="emailToggle">
            이메일로 로그인
        </button>

        <div class="email-form" id="emailForm">
            <input type="email" class="input-field" id="emailInput" placeholder="이메일 주소">
            <input type="password" class="input-field" id="passwordInput" placeholder="비밀번호 (6자 이상)">
            <button class="btn-submit" onclick="loginWithEmail()" id="emailSubmitBtn">
                <span class="loading" id="loadingSpinner">&#x21bb;</span>
                <span id="emailBtnText">로그인</span>
            </button>
            <div class="toggle-link" onclick="toggleSignup()" id="toggleText">
                계정이 없으신가요? <strong>회원가입</strong>
            </div>
        </div>

        <div class="message" id="message"></div>

        <div class="divider">또는</div>

        <button class="btn-social btn-guest" onclick="startGuest()">
            비회원으로 시작
        </button>
        <div class="guest-note">리포트 열람만 가능 · 포트폴리오 기능 제한</div>

        <div style="text-align:center;">
            <a href="admin_setup.html" class="admin-link">관리자 계정 등록 &rarr;</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase_config.js"></script>
<script>
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let isSignup = false;

const BASE_URL = window.location.href.replace(/\/[^/]*$/, '/');

sb.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'index.html';
});

async function loginWithGithub() {
    const { error } = await sb.auth.signInWithOAuth({
        provider: 'github',
        options: { redirectTo: BASE_URL + 'index.html' }
    });
    if (error) showMessage(error.message, 'error');
}

async function loginWithGoogle() {
    const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: BASE_URL + 'index.html' }
    });
    if (error) showMessage(error.message, 'error');
}

function toggleEmailForm() {
    document.getElementById('emailForm').classList.toggle('active');
}

function toggleSignup() {
    isSignup = !isSignup;
    document.getElementById('emailBtnText').textContent = isSignup ? '회원가입' : '로그인';
    document.getElementById('toggleText').innerHTML = isSignup
        ? '이미 계정이 있으신가요? <strong>로그인</strong>'
        : '계정이 없으신가요? <strong>회원가입</strong>';
}

async function loginWithEmail() {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;

    if (!email || !password) { showMessage('이메일과 비밀번호를 입력하세요', 'error'); return; }
    if (password.length < 6) { showMessage('비밀번호는 6자 이상이어야 합니다', 'error'); return; }

    setLoading(true);

    if (isSignup) {
        const { error } = await sb.auth.signUp({ email, password });
        setLoading(false);
        if (error) { showMessage(error.message, 'error'); return; }
        showMessage('확인 이메일을 보냈습니다. 메일을 확인해주세요!', 'success');
    } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        setLoading(false);
        if (error) { showMessage(error.message, 'error'); return; }
        window.location.href = 'index.html';
    }
}

function showMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.className = 'message ' + type;
}

function setLoading(on) {
    document.getElementById('loadingSpinner').classList.toggle('active', on);
    document.getElementById('emailSubmitBtn').disabled = on;
}

function startGuest() {
    sessionStorage.setItem('titan_guest', 'true');
    window.location.href = 'index.html';
}

document.getElementById('passwordInput')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loginWithEmail();
});
</script>
</body>
</html>
